[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
license = "MIT"
license-files = ["LICENSE"]
name = "d0-eric"
version = "0.1.0"
description = "Typed Accounting machine API client backed by d0-auth-machine"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["d0-auth-machine==0.1.0"]

[tool.uv.sources]
d0-auth-machine = { workspace = true }

[dependency-groups]
dev = ["mypy==2.4.0", "ruff==0.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/d0_eric"]

[tool.mypy]
follow_untyped_imports = true
