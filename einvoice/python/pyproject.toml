[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
license = "MIT"
license-files = ["LICENSE"]
name = "d0-einvoice"
version = "0.1.2"
description = "Validation-only EInvoice API client backed by d0-auth-machine"
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = ["d0-auth-machine==0.1.2"]

[tool.uv.sources]
d0-auth-machine = { workspace = true }

[dependency-groups]
dev = ["mypy==2.4.1", "ruff==0.17.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/d0_einvoice"]

[tool.mypy]
follow_untyped_imports = true
