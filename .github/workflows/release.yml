name: Qualify and publish SDKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified 0.1.0 packages and Go module tags
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          python-version: 3.14.8
          enable-cache: false
      - run: tools/check.sh
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-0.1.0-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.repository == 'dev-null-GmbH/d0-sdk' && github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: public-sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-0.1.0-${{ github.sha }}
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          python-version: 3.14.8
          enable-cache: false
      - name: Verify the qualified archives
        run: |
          cd dist
          sha256sum --strict --check SHA256SUMS
      - run: python3 tools/verify_export.py
      - run: python3 tools/verify_packages.py
      - name: Refuse conflicting immutable Go tags before publishing any package
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for product in auth platform accounting einvoice eric; do
            current=$(git ls-remote --refs https://github.com/dev-null-GmbH/d0-sdk.git "refs/tags/$product/go/v0.1.0" | cut -f1)
            if [ -n "$current" ]; then test "$current" = "$RELEASE_SHA"; fi
          done
      - run: python3 tools/publish_npm.py
      - name: Publish Python with per-project OIDC identity
        run: |
          uv publish --trusted-publishing always dist/python/d0_auth_machine-0.1.0*
          for product in platform accounting einvoice eric; do
            uv publish --trusted-publishing always "dist/python/d0_${product}-0.1.0"*
          done

  go-tags:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish immutable module tags for the same qualified source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for product in auth platform accounting einvoice eric; do
            ref="refs/tags/$product/go/v0.1.0"
            current=$(git ls-remote --refs https://github.com/dev-null-GmbH/d0-sdk.git "$ref" | cut -f1)
            if [ -n "$current" ]; then
              test "$current" = "$RELEASE_SHA"
            else
              gh api --method POST repos/dev-null-GmbH/d0-sdk/git/refs -f "ref=$ref" -f "sha=$RELEASE_SHA" >/dev/null
            fi
          done

  verify-public:
    needs: go-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          python-version: 3.14.8
          enable-cache: false
      - run: python3 tools/check_install.py --public
